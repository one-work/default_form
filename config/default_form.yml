_defaults: &defaults
  autocomplete: 'off' # 这里 off 必须字符串，否则会解析为 false
  label: true
_origin: &default_origins
  label: label text-grey
  span: text-grey
  input: input
  textarea: textarea
  inline_checkbox: checkbox
  inline_checkbox_checked: checkbox
  inline_radio: radio
  inline_radio_checked: radio
_wrap: &default_wraps
  input: field-body > field > control
  select: field-body > field is-narrow > control > select is-fullwidth
  checkbox: field-body > field > control > checkbox
  radio: field-body > field > control
  checkboxes: field-body > field is-narrow > control
  radios: field-body > field > control > checkbox
_wrap_label: &default_wrap_labels
  normal: field-label is-normal
  select: field-label is-normal
  checkbox: field-label is-normal
  checkboxes: field-label
_all: &default_alls
  normal: field is-horizontal
  required: field is-horizontal
  error: field is-horizontal
  select: field is-horizontal
  checkbox: field is-horizontal
  radio: field is-horizontal
_error: &default_errors
  input: input is-danger
_before_wrap: &default_before_wraps
  checkboxes: field-label
  checkbox: field-label
  radio: field-label
_searches: &searches
  method: get
  placeholder: true
  autocomplete: 'off'
_phone: &phone
  <<: *defaults
_phone_wrap: &phone_wrap
  input: control
  select: control > select is-fullwidth
_phone_all: &phone_all
  normal: field
  error: field
  required: field
  select: field
  checkbox: field
  radio: field

# 开始配置
default:
  <<: *defaults
  form: form-horizontal
  origin:
    <<: *default_origins
    label: label
    textarea: field textarea
    submit: button is-primary
  before_wrap:
    <<: *default_before_wraps
    submit: field-label
  wrap:
    <<: *default_wraps
    submit: field-body control
  wrap_label:
    <<: *default_wrap_labels
  all:
    <<: *default_alls
    submit: field is-horizontal
  error:
    <<: *default_errors
modal:
  <<: *defaults
  form: modal-card
  origin:
    <<: *default_origins
    submit: button is-rounded is-primary
  before_wrap:
    <<: *default_before_wraps
  wrap:
    <<: *default_wraps
    submit: footer.modal-card-foot
  wrap_label:
    <<: *default_wrap_labels
  all:
    <<: *default_alls
  error:
    <<: *default_errors
modal_line:
  <<: *defaults
  label: false
  form: modal-card
  origin:
    <<: *default_origins
    submit: button is-rounded is-primary
  wrap:
    submit: footer.modal-card-foot
line:
  <<: *defaults
  origin:
    label: label text-grey
    input: input
    textarea: textarea
    submit: button is-primary
  wrap:
    input: control
  all:
    normal: field
  error:
    <<: *default_errors
phone_default:
  <<: *phone
  form: form-fields as-boxed
  origin:
    label: label text-grey
    input: input
    textarea: textarea
    submit: button is-fullwidth is-primary
    checkbox: checkbox
    radio: radio
  wrap:
    <<: *phone_wrap
    checkbox: weui-cell__hd
    radio: weui-cell__ft
    submit: mt-3
  all:
    <<: *phone_all
  error:
    <<: *default_errors
  after:
    checkbox: <i class="weui-icon-checked"></i>
    radio: <i class="weui-icon-checked"></i>
phone_modal:
  <<: *phone
  form: modal-card has-animate-slide-up
  origin:
    <<: *default_origins
    submit: button is-fullwidth is-primary
  wrap:
    <<: *phone_wrap
    submit: footer.modal-card-foot
  all:
    <<: *phone_all
  error:
    <<: *default_errors
phone_line:
  <<: *defaults
  origin:
    label: label text-grey
    input: input
    textarea: textarea
    submit: button is-fullwidth is-primary
  wrap:
    input: control
  all:
    <<: *phone_all
  error:
    <<: *default_errors
search:
  <<: *searches
  form: field is-horizontal
  origin:
    input: input
    submit: button is-primary
  wrap:
    input: field is-narrow
    select: field is-narrow > select
inline:
  <<: *defaults
  label: false
  form: field is-grouped
  origin:
    input: input is-small
    submit: button is-small is-primary
switch:
  form: switch-form
  wrap:
    checkbox: label.switch.is-rounded.is-primary
lexxy:
  <<: *defaults
  all:
    <<: *default_alls
  wrap:
    <<: *default_wraps
    submit: text-centered mt-2
  origin:
    <<: *default_origins
    submit: button is-medium is-primary
fields:
  <<: *defaults
  wrap:
    input: field
  origin:
    <<: *default_origins
